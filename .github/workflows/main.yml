name: Revisar y Publicar Web

on:
  push:
    branches: [ "main" ]

jobs:
  revisar-y-subir:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4
      
      - name: Comprobar que existe la web
        run: test -f index.html

      - name: Preparar página
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar en internet
        id: deployment
        uses: actions/deploy-pages@v4
